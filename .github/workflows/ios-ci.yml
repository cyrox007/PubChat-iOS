name: iOS CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Xcode environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project PubChat.xcodeproj

      - name: Compile without a signing certificate
        run: |
          set -o pipefail
          xcodebuild \
            -project PubChat.xcodeproj \
            -scheme PubChat \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Swift tests on available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; matches=[d["udid"] for runtime in devices.values() for d in runtime if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(matches[0] if matches else "")')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "::error::No available iPhone simulator in the runner image"
            exit 1
          fi
          xcodebuild \
            -project PubChat.xcodeproj \
            -scheme PubChat \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath build/PubChatTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
