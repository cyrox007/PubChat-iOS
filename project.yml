name: PubChat
options:
  bundleIdPrefix: ru.pubchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PubChat:
    type: application
    platform: iOS
    sources:
      - path: PubChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.pubchat.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: PubChat/PubChat.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PubChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_PubChatAPIBaseURL: https://pubchat.ru/api
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  PubChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PubChatTests
    dependencies:
      - target: PubChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.pubchat.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PubChat.app/PubChat"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PubChat:
    build:
      targets:
        PubChat: all
    test:
      targets:
        - PubChatTests
